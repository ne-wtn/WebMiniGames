<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ARCADE BOOT (start) -->
  <style>html.am-booting body { visibility: hidden; }</style>
  <script>
    (() => {
      const root = document.documentElement;
      root.classList.add('am-booting');
      window.__arcadeBoot = { expired: false, timer: setTimeout(() => {
        window.__arcadeBoot.expired = true;
        root.classList.remove('am-booting');
      }, 1800) };
    })();
  </script>
  <!-- ARCADE BOOT (end) -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Function Factory — Production Line Puzzles</title>
  <meta name="description" content="An automation puzzle about functions, input-output rules, linear functions, composition and sequences.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🏭%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="fonts/Inter-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="mg-app">
    <header id="hud"></header>
    <main class="mg-main factory">
      <section class="contract" aria-labelledby="contract-h">
        <div class="contract__head">
          <h2 id="contract-h">Contract</h2>
          <span class="contract__tag" id="contractTag"></span>
        </div>
        <p class="contract__brief" id="contractBrief"></p>
        <table class="io" id="ioTable" aria-label="Required inputs and outputs"></table>
      </section>

      <aside class="palette" aria-labelledby="palette-h">
        <h2 id="palette-h">Machines</h2>
        <p class="hint">Tap a machine, then tap an empty bay.</p>
        <div class="palette__list" id="palette"></div>
      </aside>

      <section class="line" aria-labelledby="line-h">
        <h2 id="line-h" class="mg-sr-only">Production line</h2>
        <canvas id="belt" aria-label="Conveyor belt animation"></canvas>
        <div class="slots" id="slots"></div>
        <div class="line__info" id="lineInfo" aria-live="polite"></div>
        <div class="line__actions">
          <button class="mg-btn" type="button" id="clearBtn">↺ Clear Line</button>
          <button class="mg-btn mg-btn--primary mg-btn--lg" type="button" id="startBtn">▶ Start Production</button>
        </div>
      </section>

      <aside class="report" aria-labelledby="report-h">
        <h2 id="report-h">Quality control</h2>
        <div id="report" aria-live="polite"><p class="hint">Run the line to see the inspection report.</p></div>
      </aside>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
